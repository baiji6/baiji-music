org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# R8 fullMode：更激进的优化（跨类合并/更彻底的裁剪），AGP 8.1+ 默认已开启，
# 这里显式声明防止未来默认值回退；规则不兼容时可在 proguard-rules.pro 里加
# -dontoptimize 局部回退。
android.enableR8.fullMode=true

# ── v2.5.7 洛雪音源（flutter_js 0.8.7）Android 构建兼容 ──────────────────────
# flutter_js 是旧版 KGP 插件，自身声明 kotlinOptions.jvmTarget = 1.8；
# 而 AGP 9 会把插件模块的 Java 编译目标抬到 11（主工程 app 为 17）。
# KGP 的「JVM-target 一致性」校验据此直接判 :flutter_js:compileReleaseKotlin
# 失败：Inconsistent JVM-target compatibility ... (11) and ... (1.8)。
# 1.8 与 11 的字节码在 D8 desugaring 下完全兼容，实际产物无风险，
# 因此把该校验从 error 降为 warning（本地与 CI 行为一致）。
# KGP 1.9 用旧属性名，2.x 改用新属性名，两个都写上以覆盖不同版本；
# 未被识别的属性会被 Gradle 安全忽略。
kotlin.jvmTarget.validation.mode=warning
kotlin.jvm.target.validation.mode=warning

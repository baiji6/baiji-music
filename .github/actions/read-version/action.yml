# 从 pubspec.yaml 读取应用版本号，写入 APP_VERSION 环境变量。
#
# 以前在工作流顶部把 APP_VERSION 写死成某个版本号，结果 v2.2.0 发布时
# 忘了同步：Release 标题写着上一个版本，产物文件名也对不上当时的代码。
#
# pubspec.yaml 才是版本的唯一真相来源，这里直接读它。
# GITHUB_ENV 里写入的同名变量会覆盖 job 级 env，所以调用方无需改别的地方。
name: Read app version
description: 从 pubspec.yaml 读取版本号，输出到 APP_VERSION 环境变量

runs:
  using: composite
  steps:
    - name: Read version from pubspec.yaml
      shell: bash
      run: |
        version=$(grep -m1 '^version:' pubspec.yaml \
          | sed 's/^version:[[:space:]]*//' \
          | cut -d+ -f1 \
          | tr -d '\r\n\t ')
        if [ -z "$version" ]; then
          echo "::error::无法从 pubspec.yaml 读取版本号" >&2
          exit 1
        fi
        # 顺带校验格式，避免手滑写成 2.2 这类非法值。
        # 允许 SemVer 预发布后缀（2.2.2-fix1 这类修订版就是这么标的）。
        if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
          echo "::error::版本号 '$version' 不是合法的 x.y.z 形式" >&2
          exit 1
        fi
        echo "APP_VERSION=$version" >> "$GITHUB_ENV"
        echo "发布版本：$version"

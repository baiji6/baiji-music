# ==============================================================================
# 白姬音乐 · 六端自动构建流水线（GitHub Actions）
# ------------------------------------------------------------------------------
# 触发：push 到 main / 打 v* 标签 / 手动 workflow_dispatch
# 每个平台构建后自动执行加固：
#   Android : R8 全量混淆 + 资源压缩（gradle 内置）+ Dart 混淆 + 正式 jks 签名(v1+v2+v3)
#   iOS     : Release 构建 + Dart 混淆（未签名 ipa/app，供安装包提取使用）
#   macOS   : Release 构建 + Dart 混淆 + strip 符号剥离
#   Windows : Release 构建 + Dart 混淆 + UPX 加壳
#   Linux   : Release 构建 + Dart 混淆 + UPX 加壳（使用仓库固化的 UPX 二进制）
#   ohos    : 工程完整性校验（鸿蒙 SDK 需 DevEco Studio 本地构建，见 ohos/README.md）
# 产物统一上传为 GitHub Actions Artifact，可直接下载。
# ==============================================================================
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'
  # Dart 混淆参数（六端通用核心防逆向）
  OBF_ARGS: --obfuscate --split-debug-info=build/out/debug-info

jobs:
  # ---------------------------------------------------------------- Android
  android:
    name: Android APK（R8 混淆 + jks 签名）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      # 从 secrets 解码签名密钥（密钥文件不入库）
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/app/keystore/baiji9527.jks
          keytool -list -keystore android/app/keystore/baiji9527.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" 2>&1 | head -6

      - name: Build release APK（R8 + 资源压缩）
        run: flutter build apk --release ${{ env.OBF_ARGS }}

      # AGP 在新版本里可能只生成 v2/v3，这里用 apksigner 显式强制重签完整的 v1+v2+v3 签名链
      - name: Force re-sign v1+v2+v3 (apksigner)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore/baiji9527.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | tail -1)/apksigner"
          APP=$(find build/app/outputs -name "*.apk" | head -1)
          echo "APK: $APP"
          ls -la "$APP"
          "$APKSIGNER" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APP"
          echo "re-sign ok"

      - name: Verify v1+v2+v3 signatures
        run: |
          set -euo pipefail
          APP=$(find build/app/outputs -name "*.apk" | head -1)
          echo "APK: $APP"
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APP" | tee sign-verify.log
          echo "---- signature scheme check ----"
          grep -q "^Verified using v1 scheme (JAR signing): true" sign-verify.log && echo "v1 OK"
          grep -q "^Verified using v2 scheme (APK Signature Scheme v2): true" sign-verify.log && echo "v2 OK"
          grep -q "^Verified using v3 scheme (APK Signature Scheme v3): true" sign-verify.log && echo "v3 OK"
          grep -q "^Verified using v1 scheme (JAR signing): true" sign-verify.log && \
          grep -q "^Verified using v2 scheme (APK Signature Scheme v2): true" sign-verify.log && \
          grep -q "^Verified using v3 scheme (APK Signature Scheme v3): true" sign-verify.log || {
            echo "::error::APK signature incomplete (must be v1+v2+v3)"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiji-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- iOS
  ios:
    name: iOS Release（未签名）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS Release
        run: flutter build ios --release --no-codesign ${{ env.OBF_ARGS }}

      # 符号剥离（DebugSymbols / 本地符号表）
      - name: Strip symbols
        run: |
          find build/ios/iphoneos -name "*.app" -maxdepth 2 | while read APP; do
            xcrun strip -x "$APP/$(basename "${APP%.app}")" || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiji-ios-app
          path: build/ios/iphoneos/*.app
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS
  macos:
    name: macOS Release（strip 符号）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release ${{ env.OBF_ARGS }}

      # 符号剥离：等价于 Xcode STRIP_INSTALLED_PRODUCT
      - name: Strip symbols
        run: |
          find build/macos/Build/Products/Release -type f -perm -111 | while read BIN; do
            strip -x "$BIN" 2>/dev/null || true
          done

      - name: Package dmg/app zip
        run: |
          cd build/macos/Build/Products/Release
          APP=$(find . -maxdepth 1 -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "no .app found"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" "baiji-macos.zip" 2>/dev/null || \
            zip -qr baiji-macos.zip "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiji-macos
          path: build/macos/Build/Products/Release/baiji-macos.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows Release（UPX 加壳）
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release ${{ env.OBF_ARGS }}

      # 下载 UPX Windows 版并加壳所有可执行文件
      - name: UPX pack
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath .
          $exes = Get-ChildItem -Path build/windows/x64/runner/Release -Filter *.exe -Recurse
          foreach ($e in $exes) {
            .\upx-4.2.4-win64\upx.exe --best -f $e.FullName
          }

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath baiji-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiji-windows
          path: baiji-windows.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux
  linux:
    name: Linux Release（UPX 加壳）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release ${{ env.OBF_ARGS }}

      # 使用仓库固化的 UPX 二进制加壳
      - name: UPX pack
        run: |
          chmod +x tools/upx/upx-linux-x64
          find build/linux/x64/release/bundle -type f -perm -111 | while read BIN; do
            ./tools/upx/upx-linux-x64 --best -f "$BIN" || true
          done

      - name: Package zip
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../baiji-linux.tar.gz bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiji-linux
          path: baiji-linux.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------- ohos（鸿蒙）
  ohos:
    name: HarmonyOS 壳工程校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # GitHub 托管 runner 无鸿蒙 SDK/DevEco，无法直接出包；
      # 此任务校验壳工程完整性，正式 HAP 需用 DevEco Studio 5.0+ 本地构建（见 ohos/README.md）
      - name: Validate ohos shell project
        run: |
          for f in \
            ohos/build-profile.json5 \
            ohos/entry/build-profile.json5 \
            ohos/entry/obfuscation-rules.txt \
            ohos/entry/src/main/module.json5 \
            ohos/entry/src/main/ets/entryability/EntryAbility.ets \
            ohos/entry/src/main/ets/pages/Index.ets ; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "ohos shell project OK（含方舟混淆规则，release 构建自动生效）"
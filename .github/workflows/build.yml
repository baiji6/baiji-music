# ==============================================================================
# 白姬音乐 · 五端自动构建 + GitHub Releases 发布流水线（GitHub Actions）
# ------------------------------------------------------------------------------
# 触发：
#   - push 到 main        ：构建五端并上传 Artifact（供持续验证/预发布检查）
#   - 推送 v* 标签        ：构建五端并把产物发布到 GitHub Releases
#   - workflow_dispatch   ：手动触发（按 tag 与否决定是否发布）
# 产物格式：
#   Android : .apk（R8 全量混淆 + 资源压缩 + Dart 混淆 + jks 正式签名 v1+v2+v3，apksigner 严格验证）
#   iOS     : .ipa（Release 构建 + Dart 混淆，未签名，符号剥离）
#   macOS   : .dmg ×2（Intel x64 + Apple Silicon arm64 双架构，Release + Dart 混淆 + strip）
#   Windows : .exe（自解压安装包，UPX 加壳 + Dart 混淆，另附 .zip 绿色版）
#   Linux   : .deb（Debian 安装包，UPX 加壳 + Dart 混淆）
# 加固措施（打包阶段自动执行）：
#   Android : R8 全量混淆 + 资源压缩（gradle 内置）+ Dart 混淆 + 正式 jks 签名(v1+v2+v3)
#   iOS     : Dart 混淆 + 符号剥离（等价 STRIP_INSTALLED_PRODUCT）
#   macOS   : Dart 混淆 + 符号剥离
#   Windows : Dart 混淆 + UPX 加壳
#   Linux   : Dart 混淆 + UPX 加壳（仓库固化的 UPX 二进制）
# ==============================================================================
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  # 注意：不要在这里写死 APP_VERSION。
  # 每个作业开头都会调用 ./.github/actions/read-version 从 pubspec.yaml
  # 读取真实版本并写入 $GITHUB_ENV，覆盖同名的工作流级变量。
  # 历史上这里写死过 '2.1.0'，导致后续发版的 Release 标题与产物名全部错位。
  #
  # Dart 混淆参数（五端通用核心防逆向）
  OBF_ARGS: --obfuscate --split-debug-info=build/out/debug-info --tree-shake-icons

# ==============================================================================
# 桌面端完整性签名（#78 签名校验）
# secret INTEGRITY_SIGN_KEY_PEM（ed25519 PKCS#8 PEM）存在时：
#   - 构建命令追加 --dart-define=BAIJI_CI_BUILD=true（应用侧据此要求
#     官方产物必须带完整性清单，堵住「删清单绕过校验」）；
#   - 打包前用 tools/integrity_sign.py 生成并签名 integrity.manifest。
# secret 未配置时跳过签名（应用侧缺清单 → 放行，与旧产物一致）。
# ==============================================================================

jobs:
  # ---------------------------------------------------------------- Android
  android:
    name: Android APK（R8 混淆 + jks 签名）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/read-version

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      # 从 secrets 解码签名密钥（密钥文件不入库）
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/app/keystore/baiji9527.jks
          keytool -list -keystore android/app/keystore/baiji9527.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" 2>&1 | head -6

      # 把 pub-cache 里那些还停留在旧 API 的插件抬到 36，以贴合主项目的 compileSdk=36
      # （宿主 compileSdk 必须 ≥ 依赖 AAR metadata 里的 minCompileSdk，否则
      #   checkReleaseAarMetadata 会直接判定构建失败）。
      #
      # 这里刻意只升不降：曾经 permission_handler_android 14.x 把自身 compileSdk
      # 定到 37，当时宿主是 36，靠改写 pub-cache 是压不住的——它要求的是
      # 「宿主 ≥ 37」，降写插件反而会让本地与 CI 行为割裂。真正的修法是在
      # pubspec 里把 permission_handler 钉回 12.x（对应 android 13.x，
      # compileSdk 35），详见 pubspec.yaml 里的注释。
      - name: Bump plugin compileSdk to 36
        run: |
          find ~/.pub-cache -path "*/android/build.gradle" -exec sed -i 's/compileSdkVersion\s*34/compileSdkVersion 36/g; s/compileSdk\s*34/compileSdk 36/g; s/compileSdkVersion\s*35/compileSdkVersion 36/g; s/compileSdk\s*35/compileSdk 36/g' {} + || true
          find /home/runner/.pub-cache -path "*/android/build.gradle" -exec sed -i 's/compileSdkVersion\s*34/compileSdkVersion 36/g; s/compileSdk\s*34/compileSdk 36/g; s/compileSdkVersion\s*35/compileSdkVersion 36/g; s/compileSdk\s*35/compileSdk 36/g' {} + || true

      - name: Build release APK（R8 + jks 直签 v1+v2+v3）
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore/baiji9527.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release ${{ env.OBF_ARGS }}

      - name: Rename APK
        run: |
          APP=$(find build/app/outputs -name "*.apk" | head -1)
          cp "$APP" "baiji-music-${{ env.APP_VERSION }}-android.apk"

      - name: Verify v1+v2+v3 signatures (apksigner)
        run: |
          set -euo pipefail
          APP=$(find build/app/outputs -name "*.apk" | head -1)
          echo "APK: $APP"
          APKSI="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | tail -1)/apksigner"
          ls -la "${ANDROID_HOME}/build-tools"
          "$APKSI" --version 2>&1 || true
          "$APKSI" verify --verbose --print-certs --min-sdk-version 21 "$APP" | tee sign-verify.log
          echo "---- signature scheme check ----"
          grep -q "^Verified using v1 scheme (JAR signing): true" sign-verify.log && echo "v1 OK"
          grep -q "^Verified using v2 scheme (APK Signature Scheme v2): true" sign-verify.log && echo "v2 OK"
          grep -q "^Verified using v3 scheme (APK Signature Scheme v3): true" sign-verify.log && echo "v3 OK"
          grep -q "^Verified using v1 scheme (JAR signing): true" sign-verify.log && \
          grep -q "^Verified using v2 scheme (APK Signature Scheme v2): true" sign-verify.log && \
          grep -q "^Verified using v3 scheme (APK Signature Scheme v3): true" sign-verify.log || {
            echo "::error::APK signature incomplete (must be v1+v2+v3)"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiji-android-apk
          path: baiji-music-${{ env.APP_VERSION }}-android.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- iOS
  ios:
    name: iOS Release ipa（未签名）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/read-version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS Release
        run: flutter build ios --release --no-codesign ${{ env.OBF_ARGS }}

      # 符号剥离（DebugSymbols / 本地符号表）
      - name: Strip symbols
        run: |
          find build/ios/iphoneos -name "*.app" -maxdepth 2 | while read APP; do
            xcrun strip -x "$APP/$(basename "${APP%.app}")" || true
          done

      # 组装标准 .ipa 结构（Payload/*.app），未签名，供签名/分发
      - name: Package ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          APP=$(find build/ios/iphoneos -name "*.app" -maxdepth 2 | head -1)
          echo "APP dir: $APP"
          [ -n "$APP" ] || { echo "no .app found"; exit 1; }
          cp -R "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry "../../../baiji-music-${{ env.APP_VERSION }}-ios.ipa" Payload
          cd ../../..
          ls -la baiji-music-${{ env.APP_VERSION }}-ios.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiji-ios
          path: baiji-music-${{ env.APP_VERSION }}-ios.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS（双架构）
  macos:
    name: macOS Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/read-version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      # 完整性签名私钥（ed25519 PEM）。没有配置 secret 时 has_key=false，
      # 构建不加 BAIJI_CI_BUILD 标记、也不生成清单。
      - name: Integrity signing key
        id: integrity
        env:
          KEY_PEM: ${{ secrets.INTEGRITY_SIGN_KEY_PEM }}
        run: |
          if [ -n "$KEY_PEM" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            mkdir -p build/out
            printf '%s' "$KEY_PEM" > build/out/integrity-key.pem
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build macOS Release
        run: >-
          flutter build macos --release ${{ env.OBF_ARGS }}
          ${{ steps.integrity.outputs.has_key == 'true' && '--dart-define=BAIJI_CI_BUILD=true' || '' }}

      # 符号剥离：等价于 Xcode STRIP_INSTALLED_PRODUCT
      - name: Strip symbols
        run: |
          find build/macos/Build/Products/Release -type f -perm -111 | while read BIN; do
            strip -x "$BIN" 2>/dev/null || true
          done

      # 完整性清单（覆盖整个 .app/Contents，exe 在 Contents/MacOS 下，
      # 清单放在 Contents 根——应用侧会从 exe 目录向上找清单）
      - name: Sign integrity manifest
        if: steps.integrity.outputs.has_key == 'true'
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "::error::no .app found"; exit 1; }
          python3 tools/integrity_sign.py "$APP/Contents" \
            build/out/integrity-key.pem "${{ env.APP_VERSION }}"

      # 制作 .dmg（UDZO 压缩镜像，含 /Applications 拖拽入口）
      - name: Package dmg
        run: |
          cd build/macos/Build/Products/Release
          APP=$(find . -maxdepth 1 -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "no .app found"; exit 1; }
          rm -rf "$OLDPWD/dmg-staging"
          mkdir -p "$OLDPWD/dmg-staging"
          cp -R "$APP" "$OLDPWD/dmg-staging/"
          ln -s /Applications "$OLDPWD/dmg-staging/Applications"
          hdiutil create -volname "白姬音乐" -srcfolder "$OLDPWD/dmg-staging" \
            -ov -format UDZO \
            "$OLDPWD/baiji-music-${{ env.APP_VERSION }}-macos-${{ matrix.arch }}.dmg"
          cd "$OLDPWD"
          rm -rf dmg-staging
          ls -la baiji-music-${{ env.APP_VERSION }}-macos-${{ matrix.arch }}.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiji-macos-${{ matrix.arch }}
          path: baiji-music-${{ env.APP_VERSION }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows Release exe（UPX 加壳）
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/read-version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      # 完整性签名私钥（ed25519 PEM）。没有配置 secret 时 has_key=false。
      - name: Integrity signing key
        id: integrity
        env:
          KEY_PEM: ${{ secrets.INTEGRITY_SIGN_KEY_PEM }}
        shell: pwsh
        run: |
          if ($env:KEY_PEM) {
            "has_key=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8NoBOM
            New-Item -ItemType Directory -Force -Path build/out | Out-Null
            [IO.File]::WriteAllText("build/out/integrity-key.pem", $env:KEY_PEM)
          } else {
            "has_key=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8NoBOM
          }

      - name: Build Windows Release
        run: >-
          flutter build windows --release ${{ env.OBF_ARGS }}
          ${{ steps.integrity.outputs.has_key == 'true' && '--dart-define=BAIJI_CI_BUILD=true' || '' }}

      # 下载 UPX Windows 版并加壳所有可执行文件
      - name: UPX pack
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath .
          $exes = Get-ChildItem -Path build/windows/x64/runner/Release -Filter *.exe -Recurse
          foreach ($e in $exes) {
            .\upx-4.2.4-win64\upx.exe --best -f $e.FullName
          }

      # 完整性清单（加壳后、打包前；与 exe 同目录，覆盖整个 Release 目录）
      - name: Sign integrity manifest
        if: steps.integrity.outputs.has_key == 'true'
        shell: pwsh
        run: |
          python tools/integrity_sign.py build/windows/x64/runner/Release `
            build/out/integrity-key.pem "${{ env.APP_VERSION }}"

      # 绿色版 zip（内含 exe 与运行库）
      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "baiji-music-${{ env.APP_VERSION }}-windows-x64.zip"

      # 自解压安装 exe（7-Zip SFX）
      - name: Package sfx exe
        shell: pwsh
        run: |
          $7z = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $7z)) { choco install 7zip -y --no-progress | Out-Null }
          if (-not (Test-Path $7z)) { Write-Error "7-Zip not available"; exit 1 }
          $sfx = "C:\Program Files\7-Zip\7z.sfx"
          if (-not (Test-Path $sfx)) { Write-Error "7z.sfx not found"; exit 1 }
          Push-Location build/windows/x64/runner/Release
          & $7z a -t7z "-sfx$sfx" -mx=9 -y "$env:GITHUB_WORKSPACE\baiji-music-${{ env.APP_VERSION }}-windows-x64.exe" * | Out-Null
          Pop-Location
          Get-Item "baiji-music-${{ env.APP_VERSION }}-windows-x64.exe" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiji-windows
          path: |
            baiji-music-${{ env.APP_VERSION }}-windows-x64.exe
            baiji-music-${{ env.APP_VERSION }}-windows-x64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux
  linux:
    name: Linux Release deb（UPX 加壳）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/read-version

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      # 完整性签名私钥（ed25519 PEM）。没有配置 secret 时 has_key=false。
      - name: Integrity signing key
        id: integrity
        env:
          KEY_PEM: ${{ secrets.INTEGRITY_SIGN_KEY_PEM }}
        run: |
          if [ -n "$KEY_PEM" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            mkdir -p build/out
            printf '%s' "$KEY_PEM" > build/out/integrity-key.pem
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Linux Release
        run: >-
          flutter build linux --release ${{ env.OBF_ARGS }}
          ${{ steps.integrity.outputs.has_key == 'true' && '--dart-define=BAIJI_CI_BUILD=true' || '' }}

      # 使用仓库固化的 UPX 二进制加壳
      - name: UPX pack
        run: |
          chmod +x tools/upx/upx-linux-x64
          find build/linux/x64/release/bundle -type f -perm -111 | while read BIN; do
            ./tools/upx/upx-linux-x64 --best -f "$BIN" || true
          done

      # 完整性清单（加壳后、打 deb 前；bundle 原样装入 /usr/share/baiji_music，
      # 运行时 /proc/self/exe 指向真实路径，exe 目录即 bundle 目录）
      - name: Sign integrity manifest
        if: steps.integrity.outputs.has_key == 'true'
        run: |
          python3 tools/integrity_sign.py build/linux/x64/release/bundle \
            build/out/integrity-key.pem "${{ env.APP_VERSION }}"

      # 组装 .deb 安装包（脚本见 tools/package-linux-deb.sh）
      - name: Package deb
        run: bash tools/package-linux-deb.sh "${{ env.APP_VERSION }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baiji-linux
          path: build/linux/baiji-music_${{ env.APP_VERSION }}_amd64.deb
          if-no-files-found: error

  # ---------------------------------------------------------------- Releases 发布
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios, macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/read-version

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -laR dist/

      # 从 CHANGELOG.md 抽出当前版本那一节作为 Release 正文。
      # 自 v2.2.1 起 Release 必须带更新日志，所以这里抽不出来就直接失败，
      # 避免又发出去一个只有「自动生成说明」的空 Release。
      - name: Extract changelog for this version
        id: changelog
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::仓库缺少 CHANGELOG.md，无法生成更新日志"
            exit 1
          fi
          python3 - "$APP_VERSION" <<'PY' >> "$GITHUB_OUTPUT"
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          # 抓 "## 2.2.1" 到下一个 "## " 之间的内容（标题行去掉 # 与空格）
          m = re.search(r'^##\s+' + re.escape(version) + r'\s*$(.*?)(?=^##\s|\Z)',
                        text, re.M | re.S)
          if not m:
              sys.exit('CHANGELOG.md 里没有找到版本 ' + version + ' 的条目')
          body = m.group(0).strip()
          print('has_changelog=true')
          print('changelog<<CHANGELOG_EOF')
          print(body)
          print('CHANGELOG_EOF')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          CHANGELOG_BODY: ${{ steps.changelog.outputs.changelog }}
        with:
          # 预发布：版本号带 -pre 后缀（如 2.4.2-pre1）时标记为
          # GitHub Pre-release，不占用「最新 Release」位（v2.4.2 开发期约定）。
          prerelease: ${{ contains(env.APP_VERSION, '-pre') }}
          files: |
            dist/baiji-music-${{ env.APP_VERSION }}-android.apk
            dist/baiji-music-${{ env.APP_VERSION }}-ios.ipa
            dist/baiji-music-${{ env.APP_VERSION }}-macos-x64.dmg
            dist/baiji-music-${{ env.APP_VERSION }}-macos-arm64.dmg
            dist/baiji-music-${{ env.APP_VERSION }}-windows-x64.exe
            dist/baiji-music-${{ env.APP_VERSION }}-windows-x64.zip
            dist/baiji-music_${{ env.APP_VERSION }}_amd64.deb
          fail_on_unmatched_files: false
          name: 白姬音乐 v${{ env.APP_VERSION }}
          body: |
            ## 白姬音乐 v${{ env.APP_VERSION }}

            五端自动构建产物（由 GitHub Actions 流水线构建并加固）：

            - **Android**：`.apk` — R8 全量混淆 + 资源压缩 + Dart 混淆 + jks 正式签名（v1+v2+v3）
            - **iOS**：`.ipa` — Release 构建 + Dart 混淆（未签名，需自行用证书签名）
            - **macOS**：`.dmg` — Intel x64 / Apple Silicon arm64 双架构 + Dart 混淆 + 符号剥离
            - **Windows**：`.exe` 自解压安装包 + `.zip` 绿色版 — UPX 加壳 + Dart 混淆
            - **Linux**：`.deb` — UPX 加壳 + Dart 混淆

            ---

            ## 更新日志

            ${{ env.CHANGELOG_BODY }}

            ---

            更多信息见仓库 README。

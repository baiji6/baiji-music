[package]
name = "baka-av3a-container"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/Zencok/baka"
description = "MP4 demuxing, progressive input and range playback for AV3A audio"
readme = "README.md"
keywords = ["av3a", "audio", "decoder", "codec", "pcm"]
categories = ["multimedia::audio", "multimedia::encoding"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[dependencies]
baka-av3a-core = { version = "0.1.2", path = "../baka-av3a-core" }


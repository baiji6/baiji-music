name: baiji_music
description: "白姬音乐 - 跨平台音乐播放客户端（iOS / macOS / Windows / Linux / Android / HarmonyOS）"
publish_to: 'none'

version: 2.0.5+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP 客户端（Cookie、流式下载、超时）
  dio: ^5.7.0
  # 本地键值存储
  shared_preferences: ^2.3.3
  # 密码学原语（MD5 / SHA1 / AES / RSA）
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  # zlib inflate（QRC 歌词解密）
  archive: ^4.0.2
  # 多端音频播放（Android / iOS / macOS / Windows / Linux）
  just_audio: ^0.10.0
  # 网络图片缓存（封面）
  cached_network_image: ^3.4.1
  # 各平台下载/存储目录
  path_provider: ^2.1.5
  # 分享/导出（日志导出、分享链接）
  share_plus: ^10.0.0
  # 文件选择（自定义下载目录）
  file_picker: ^8.0.0
  # 打开外部链接（更新跳转）
  url_launcher: ^6.3.0
  # 应用信息（版本号读取）
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
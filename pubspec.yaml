name: baiji_music
description: "白姬音乐 - 跨平台音乐播放客户端（iOS / macOS / Windows / Linux / Android / HarmonyOS）"
publish_to: 'none'

version: 2.2.2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP 客户端（Cookie、流式下载、超时）
  dio: ^5.7.0
  # 本地键值存储
  shared_preferences: ^2.3.3
  # 密码学原语（MD5 / SHA1 / AES / RSA）
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  # zlib inflate（QRC 歌词解密）
  archive: ^4.0.2
  # 多端音频播放（Android / iOS / macOS / Windows / Linux）
  # 基于 libmpv + ffmpeg 软解，支持几乎所有音频格式
  media_kit: ^1.1.10
  media_kit_libs_audio: ^1.0.4
  # 网络图片缓存（封面）
  cached_network_image: ^3.4.1
  # 各平台下载/存储目录
  path_provider: ^2.1.5
  # 分享/导出（日志导出、分享链接）
  share_plus: ^10.0.0
  # 文件选择（自定义下载目录）
  file_picker: ^8.0.0
  # 打开外部链接（更新跳转）
  url_launcher: ^6.3.0
  # 应用信息（版本号读取）
  package_info_plus: ^8.0.0
  # 运行时权限（本地音乐扫描需要 READ_MEDIA_AUDIO / READ_EXTERNAL_STORAGE）
  #
  # 版本上限刻意卡在 12.x：13.x 的 pubspec 硬性依赖
  # `permission_handler_android: ^14.1.0`，而后者把自身 compileSdk 抬到了 37，
  # 其 AAR metadata 会要求宿主工程的 compileSdk ≥ 37。
  # 本项目 android/app/build.gradle.kts 用的是 compileSdk = 36
  # （AGP 9.1.0 官方支持的最高 API 就是 36，且 API 37 的平台包已改名
  #  platforms;android-37.x），因此会卡在 checkReleaseAarMetadata 直接构建失败。
  # 12.0.3 对应 permission_handler_android 13.x（compileSdk 35），与 36 相容。
  # 升级本依赖前请务必先确认 android_impl 的 compileSdk 要求。
  permission_handler: ^12.0.3
  flutter_markdown_plus: ^1.0.12
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
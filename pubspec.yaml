name: baiji_music
description: "白姬音乐 - 跨平台音乐播放客户端（iOS / macOS / Windows / Linux / Android / HarmonyOS）"
publish_to: 'none'

version: 2.4.2-pre1+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP 客户端（Cookie、流式下载、超时）
  dio: ^5.7.0
  # 本地键值存储
  shared_preferences: ^2.3.3
  # 密码学原语（MD5 / SHA1 / AES / RSA）
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  # zlib inflate（QRC 歌词解密）
  archive: ^4.0.2
  # 多端音频播放（Android / iOS / macOS / Windows / Linux）
  # 基于 libmpv + ffmpeg 软解，支持几乎所有音频格式
  media_kit: ^1.1.10
  media_kit_libs_audio: ^1.0.4
  # 网络图片缓存（封面）
  cached_network_image: ^3.4.1
  # 各平台下载/存储目录
  path_provider: ^2.1.5
  # 分享/导出（日志导出、分享链接）
  share_plus: ^10.0.0
  # 文件选择（自定义下载目录）
  file_picker: ^8.0.0
  # 打开外部链接（更新跳转）
  url_launcher: ^6.3.0
  # 应用信息（版本号读取）
  package_info_plus: ^8.0.0
  # 运行时权限（本地音乐扫描需要 READ_MEDIA_AUDIO / READ_EXTERNAL_STORAGE）
  #
  # 版本上限刻意卡在 12.x：13.x 的 pubspec 硬性依赖
  # `permission_handler_android: ^14.1.0`，而后者把自身 compileSdk 抬到了 37，
  # 其 AAR metadata 会要求宿主工程的 compileSdk ≥ 37。
  # 本项目 android/app/build.gradle.kts 用的是 compileSdk = 36
  # （AGP 9.1.0 官方支持的最高 API 就是 36，且 API 37 的平台包已改名
  #  platforms;android-37.x），因此会卡在 checkReleaseAarMetadata 直接构建失败。
  # 12.0.3 对应 permission_handler_android 13.x（compileSdk 35），与 36 相容。
  # 升级本依赖前请务必先确认 android_impl 的 compileSdk 要求。
  permission_handler: ^12.0.3
  flutter_markdown_plus: ^1.0.12
  gal: ^2.3.3
  flutter_miuix: ^1.3.0
  # 歌词渲染引擎：AMLL（Apple Music 风格）语义的 Canvas 实现——逐字高亮、
  # 词级上弹/悬浮、前奏倒计时、点击跳转、滚动跟随。官方 AMLL 只有
  # DOM / React / Vue 绑定，Flutter 侧用它替代 v2.3.0 的自绘卡拉 OK
  # （用户反馈「逐字歌词依旧没有」，改用成熟引擎）。纯 Dart，六端通吃。
  flutter_lyric: ^4.1.0
  # 莫奈取色（设置里可开关）：读 Android 系统壁纸强调色作主题种子。
  # 注意本包同时是 flutter_miuix 的传递依赖（其平台动态取色走同一通道），
  # 提升为直接依赖不改变解析结果，只是让 import 它名正言顺。
  dynamic_color: ^1.9.0
  ed25519_edwards: ^0.3.2
  # 网易云扫码登录的二维码本地渲染（内容形如 https://music.163.com/login?codekey=…）。
  qr_flutter: ^4.1.0
  fast_gbk: ^1.0.0
  # @visibleForTesting 注解（kuwo_api 的 qualityOfBr 等测试钩子）。
  # 提升为直接依赖不改变解析结果，只是让 import 它名正言顺。
  meta: ^1.16.0
  http: ^1.6.0

dependency_overrides:
  # AC-4 解码：官方 media_kit_libs_android_audio 1.3.8 的 ffmpeg 是白名单编译，
  # 不含 ac4 解码器，QQ 音乐 D004 / 酷我 dolby_ac4 的杜比全景声无法播放。
  # 这里换成自编译版本（ffmpeg 7.1.3 + Jellyfin AC-4 补丁 + mpv 0.35.1），
  # 源码见 third_party/media_kit_libs_android_audio，native 库托管在
  # baiji-music releases 的 libs-ac4-v1。
  media_kit_libs_android_audio:
    path: third_party/media_kit_libs_android_audio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 测试里替换 path_provider 的平台实现（纯 test 环境没有真实实现），
  # 所以要显式声明为直接依赖。
  path_provider_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/donate/